# Battery % here comes from the cell voltage (no fuel gauge), and under boot or
# session-start load it reads a few percent low. The stock 2 % action powered
# the tablet off right after login at ~5 %. lowbat-poweroff (3.45 V for three
# minutes, off the charger) is the real guard; upower only acts at 1 %.
[UPower]
PercentageLow=15.0
PercentageCritical=3.0
PercentageAction=1.0
