# The connsys driver has no NVRAM here and makes up a new MAC on every boot.
# NM cannot override it (the driver has no ndo_set_mac_address: "Not supported"),
# so the DHCP address changes per boot; reach the tablet as lenovo-tabe7.local (avahi).
# ponytail: kept as a no-op until the driver derives a fixed MAC.
[connection]
wifi.cloned-mac-address=stable
# Power save made ping 1-2 s and dropped ARP replies, so ssh over Wi-Fi failed.
wifi.powersave=2
