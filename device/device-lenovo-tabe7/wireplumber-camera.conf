# lenovo-tabe7: the only V4L2 video node is the raw MT8167 camsv (Bayer, no ISP);
# apps must use the libcamera nodes (software ISP). Back camera first, the
# front sensor gives no frames yet so it is hidden.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*camera_17" } ]
    actions = { update-props = { priority.session = 1200 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*camera_21" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
