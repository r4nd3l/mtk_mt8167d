# Lenovo Tab E7 (TB-7104F): MT8167 internal codec and an external speaker amp
# on GPIO2, fed from the headphone output (DAPM widget "Speaker" in the machine
# driver). The MT6392 class-D is unused.
# Headphone plug detection: the machine driver exposes "Headphone Jack" from
# GPIO19 (linux r47+). Both devices share one PCM and are deliberately not
# conflicting, so PipeWire shows one sink with two ports and moves between them
# on the jack; with ConflictingDevice it made two profiles and never switched.

SectionVerb {
	EnableSequence [
		# DL1 -> ADDA DL
		cset "name='O03 I05 Switch' on"
		cset "name='O04 I06 Switch' on"
		cset "name='INT ADDA O03_O04 Switch' on"
		# ADDA UL -> VUL
		cset "name='O09 I03 Switch' on"
		cset "name='O10 I04 Switch' on"
	]
	DisableSequence [
		cset "name='O03 I05 Switch' off"
		cset "name='O04 I06 Switch' off"
		cset "name='INT ADDA O03_O04 Switch' off"
		cset "name='O09 I03 Switch' off"
		cset "name='O10 I04 Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	# The external amp (GPIO2) sits on the left headphone channel; line out and the
	# MT6392 class-D only leak a faint signal into it (measured -42 dB).
	EnableSequence [
		cset "name='HPOUT Mux' AUDIO_AMP"
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='HPOUT Mux' OPEN"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		# mono speaker on the left headphone channel: let PipeWire downmix
		PlaybackChannels 1
		PlaybackMixerElem "Audio Amp"
		PlaybackVolume "Audio Amp Playback Volume"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='HPOUT Mux' AUDIO_AMP"
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
		cset "name='HPOUT Mux' OPEN"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
		PlaybackMixerElem "Audio Amp"
		PlaybackVolume "Audio Amp Playback Volume"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='AIN Mux' 'INT ADC'"
		cset "name='AIF TX Mux' 'Analog MIC'"
		cset "name='Left PGA Mux' CH0"
		cset "name='Right PGA Mux' CH0"
		cset "name='Internal Mic Switch' on"
	]
	DisableSequence [
		cset "name='Internal Mic Switch' off"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "PGA"
		CaptureVolume "PGA Capture Volume"
	}
}
